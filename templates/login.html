<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UNIZULU Grievance Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page auth-login">
    <div class="card">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="UNIZULU Logo" class="logo">
        <h2>Grievance Portal Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="role">Login As</label>
                <select name="role" id="role" required>
                    <option value="" selected disabled>Select Role</option>
                    <option value="student">Student</option>
                    <option value="staff">Staff Member</option>
                    <option value="admin">System Administrator</option>
                </select>
            </div>
            <!-- JavaScript reveals this field only when staff is selected. -->
            <div class="form-group is-hidden" id="department-group">
                <label for="department">Department</label>
                <select name="department" id="department">
                    <option value="" selected disabled>Select Department</option>
                    {% for department in departments %}
                    <option value="{{ department }}">{{ department }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="username">Username / ID</label>
                <input type="text" name="username" id="username" required placeholder="Enter your 9-digit student number" pattern="[0-9]{9}" title="Student number must be exactly 9 digits." inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>

        <div class="links">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a> | 
            <a href="{{ url_for('register') }}">Create Account</a>
        </div>
    </div>
</body>
</html>
